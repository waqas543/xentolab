# Default extraction rules. A job can extend any list through its own `extraction:` section.

default_region: PK

provinces:
  Punjab: [punjab]
  Sindh: [sindh]
  Khyber Pakhtunkhwa: [khyber pakhtunkhwa, kpk, k.p.k, nwfp]
  Balochistan: [balochistan, baluchistan]
  Islamabad Capital Territory: [islamabad capital territory, ict]
  Gilgit-Baltistan: [gilgit-baltistan, gilgit baltistan]
  Azad Jammu and Kashmir: [azad jammu and kashmir, azad kashmir, ajk]

# city -> province
