# Words that make a text span look like a street address.
address_keywords:
  - plot
  - office
  - suite
  - floor
  - building
  - plaza
  - tower
  - road
  - street
  - st.
  - block
  - phase
  - sector
  - industrial area
  - industrial estate
  - main boulevard
  - avenue
  - dha
  - gulberg
  - clifton
  - shahrah
  - house no
  - p.o. box

# Legal-form suffixes stripped from company names before searching (longest first is not required).
company_suffixes:
  - (smc-private) limited
  - (smc-pvt) ltd
  - smc-private limited
  - smc-pvt ltd
  - (private) limited
  - (pvt) limited
  - (pvt.) limited
  - (pvt) ltd
  - (pvt.) ltd.
  - (pvt.) ltd
  - private limited
  - pvt limited
  - pvt. ltd.
  - pvt ltd
  - pvt. ltd
  - public limited company
  - limited
  - ltd.
  - ltd
  - llp
  - (guarantee) limited
  - inc.
  - inc
  - plc

# Domains that are never a company's own website, by category.
generic_domains:
  search: [duckduckgo.com, google.com, google.com.pk, bing.com, yahoo.com]
  social: [facebook.com, fb.com, linkedin.com, instagram.com, twitter.com, x.com, youtube.com, tiktok.com,
           pinterest.com, reddit.com, quora.com, medium.com, threads.net, whatsapp.com, t.me, telegram.me]
  directory: [yellowpages.com.pk, businesslist.pk, pakbiz.com, yelu.pk, cybo.com, opencorporates.com, dnb.com,
              zoominfo.com, crunchbase.com, kompass.com, emis.com, rocketreach.co, apollo.io, signalhire.com,
              glassdoor.com, indeed.com, rozee.pk, mustakbil.com, bayrozgar.com, paperpk.com, pk.kompass.com,
              infobel.com, foursquare.com, tripadvisor.com, google.com, wikipedia.org, wikidata.org,
              pakistanyellowpages.com, cylex.pk, hotfrog.com.pk, find-us-here.com, trustpilot.com, bizapedia.com,
              companieshouse.gov.uk, b2bhint.com, companyhub.pk, pkcompanies.com, comparably.com, owler.com]
  marketplace: [daraz.pk, olx.com.pk, amazon.com, alibaba.com, aliexpress.com, indiamart.com, tradeindia.com,
                made-in-china.com, ebay.com, etsy.com, zameen.com, pakwheels.com, foodpanda.pk, tradekey.com,
